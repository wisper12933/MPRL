model:
  name: /mnt/hdfs/lixingzuo/qwen_model/origin/Qwen3-4B-Instruct
  trust_remote_code: true
  use_lora: false
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  gradient_checkpointing: true
  attn_implementation: null
rollout:
  mode: server
  base_url: http://127.0.0.1:8000
  api_key: EMPTY
  batch_size: 16
  batch_timeout_s: 0.05
  gpu_memory_utilization: 0.85
  tensor_parallel_size: 1
  server_timeout_s: 900
  group_port: 51216
  sync_weights: true
  weight_sync_mode: auto
training:
  group_size: 8
  learning_rate: 1.0e-06
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  num_minibatches: 8
  clip_ratio: 0.2
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
sampling:
  temperature: 0.6
  top_p: 0.95
algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 0.95
  norm_adv_by_std_in_grpo: false
  grouping_level: episode
  remove_constant_reward_groups: false
agent:
  max_steps: 1
  n_parallel_agents: null
  agent_args: {}
env:
  env_args: {}
data:
  train_files: null
  val_files: null
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 1
  val_batch_size: 8
trainer:
  total_epochs: 1
  logger:
  - console
  - wandb
  project_name: rllm-swift
  experiment_name: deepscaler-qwen3-4b-server
  test_freq: 20
  save_freq: 20000
  val_before_train: true
  default_local_dir: /tmp/rllm-swift-deepscaler-qwen3-4b-server
disable_thinking: false
filter_token_mismatch: true
