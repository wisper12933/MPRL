hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model.name=/mnt/hdfs/lixingzuo/qwen_model/origin/Qwen3-4B-Instruct
    - algorithm.adv_estimator=grpo
    - training.learning_rate=1e-6
    - training.group_size=8
    - sampling.temperature=0.6
    - sampling.top_p=0.95
    - data.train_batch_size=32
    - data.val_batch_size=30
    - data.max_prompt_length=2048
    - data.max_response_length=8192
    - agent.max_steps=1
    - trainer.logger=[console,wandb]
    - trainer.project_name=rllm-agent
    - trainer.experiment_name=qwen3-4b-16k
    - trainer.val_before_train=True
    - trainer.save_freq=600
    - trainer.test_freq=10
    - trainer.default_local_dir=/mlx_devbox/users/lixingzuo.26/MPRL/rllm/logs/qwen3-4b-16k_checkpoints
    - trainer.total_epochs=1
  job:
    name: train_deepscaler_tinker
    chdir: null
    override_dirname: agent.max_steps=1,algorithm.adv_estimator=grpo,data.max_prompt_length=2048,data.max_response_length=8192,data.train_batch_size=32,data.val_batch_size=30,model.name=/mnt/hdfs/lixingzuo/qwen_model/origin/Qwen3-4B-Instruct,sampling.temperature=0.6,sampling.top_p=0.95,trainer.default_local_dir=/mlx_devbox/users/lixingzuo.26/MPRL/rllm/logs/qwen3-4b-16k_checkpoints,trainer.experiment_name=qwen3-4b-16k,trainer.logger=[console,wandb],trainer.project_name=rllm-agent,trainer.save_freq=600,trainer.test_freq=10,trainer.total_epochs=1,trainer.val_before_train=True,training.group_size=8,training.learning_rate=1e-6
    id: ???
    num: ???
    config_name: tinker_rl_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /mlx_devbox/users/lixingzuo.26/MPRL/rllm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mlx_devbox/users/lixingzuo.26/MPRL/rllm/rllm/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mlx_devbox/users/lixingzuo.26/MPRL/rllm/outputs/2026-07-10/09-18-49
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
